<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8fa8">
<title>이토끼 예뻐해주기</title>
<link rel="icon" type="image/svg+xml" href="rabbit_female_icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff3f6;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}.card{width:min(94vw,430px);background:#fff;border:1px solid #ffe0e7;border-radius:28px;padding:22px 20px 28px;text-align:center;box-shadow:0 16px 40px rgba(193,104,125,.15);overflow:hidden}h1{margin:0 0 14px;font-size:21px;line-height:1.2;color:#2b2225}.rabbit{width:min(68%,210px);height:auto;display:block;object-fit:contain;border-radius:22px;margin:0 auto 16px}.desc{margin:0 0 20px;color:#80666e;line-height:1.6;font-size:14px}.roulette-title{min-height:34px;margin:4px 0 16px;font-size:21px;font-weight:800;color:#ff5f82;display:flex;align-items:center;justify-content:center;cursor:pointer}.roulette-wrap{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:0 auto 12px}.pointer{position:absolute;z-index:5;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #ff4f78;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}.wheel{position:absolute;inset:0;border-radius:50%;border:10px solid #ff8faa;background:conic-gradient(from -36deg,#ffe29a 0 72deg,#ff9bbb 72deg 144deg,#cdb8ff 144deg 216deg,#9edff0 216deg 288deg,#b7e6b3 288deg 360deg);box-shadow:0 10px 24px rgba(255,108,143,.25),inset 0 0 0 4px #fff;transition:transform 2s cubic-bezier(.12,.72,.12,1);cursor:pointer;will-change:transform}.wheel:after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#ff5f82;color:#fff;font-size:34px;font-weight:900;border:5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.14)}.wheel.spinning{pointer-events:none}.item{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;display:grid;place-items:center;font-size:35px;transform:rotate(var(--a)) translateY(-102px) rotate(calc(-1 * var(--a)));text-shadow:0 2px 2px rgba(255,255,255,.9)}.date-note{margin-top:18px;font-size:12px;color:#a88b94}.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;pointer-events:none;z-index:9999;animation:fall linear forwards}@keyframes fall{0%{opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(760deg);opacity:0}}.limit-box{margin:12px auto 0;padding:22px 16px;border-radius:22px;background:#fff5f8;color:#a96d7c;font-size:20px;font-weight:800;line-height:1.55}.small{display:block;margin-top:7px;font-size:13px;font-weight:600;color:#bc8b98}.shake{animation:shake .36s ease}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}@media(max-width:520px){body{padding:10px}.card{width:100%;padding:18px 16px 24px;border-radius:26px}h1{font-size:20px}.rabbit{width:min(65%,200px)}.roulette-wrap{width:min(76vw,290px)}.roulette-title{font-size:20px}.item{transform:rotate(var(--a)) translateY(-96px) rotate(calc(-1 * var(--a)))}}
</style>
</head>
<body>
<main class="card">
<h1>이토끼 예뻐해주기</h1>
<img src="rabbit_pair.png?v=7" class="rabbit" alt="나비넥타이를 맨 토끼와 귀에 리본을 단 토끼">
<p class="desc">오늘 이토끼에게 해줄 한 가지를 뽑아보세요 🐰🎀<br>소원은 하루에 한 번만 뽑을 수 있어요.</p>
<div id="rouletteTitle" class="roulette-title" aria-live="polite">룰렛을 돌려 보세요</div>
<div id="rouletteArea" class="roulette-wrap" aria-label="소원 룰렛">
<div class="pointer"></div>
<div id="wheel" class="wheel" role="button" tabindex="0" aria-label="룰렛 돌리기">
<span class="item" style="--a:0deg">💋</span>
<span class="item" style="--a:72deg">🎁</span>
<span class="item" style="--a:144deg">🌳</span>
<span class="item" style="--a:216deg">💖</span>
<span class="item" style="--a:288deg">🍪</span>
</div>
</div>
<div class="date-note">날짜가 바뀌면 다시 참여할 수 있습니다.</div>
</main>
<script>
const prizes=["뽀뽀해주기","업어주기","산책해주기","5분간 놀아주기","간식 먹기"];
const STORAGE_KEY="leeRabbitRouletteDailyV1";
const wheel=document.getElementById("wheel"),title=document.getElementById("rouletteTitle"),area=document.getElementById("rouletteArea");
let spinning=false,currentRotation=0,todayResult=null;
function todayKey(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`}
function loadToday(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");return s&&s.date===todayKey()&&s.prize?s:null}catch(e){return null}}
function saveToday(prize,index){const s={date:todayKey(),prize,index};localStorage.setItem(STORAGE_KEY,JSON.stringify(s));return s}
function fireConfetti(){const colors=["#ff7795","#ffb3c2","#ffd766","#8fd9bd","#a7bfff","#d7a6ff"];for(let i=0;i<110;i++){const c=document.createElement("span");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDuration=1.8+Math.random()*1.8+"s";c.style.animationDelay=Math.random()*.3+"s";c.style.setProperty("--drift",(Math.random()-.5)*260+"px");document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}
function showWinner(s,celebrate=false){todayResult=s;title.textContent=`🎉 당첨! ${s.prize} 🎉`;title.title="당첨 내용을 눌러 하루 1회 안내 보기";if(celebrate)fireConfetti()}
function showLimit(){if(!todayResult)return;area.innerHTML=`<div class="limit-box">소원은 하루에 한개 입니다~ 🐰<span class="small">오늘의 소원: ${todayResult.prize}</span></div>`;title.textContent="오늘의 소원 완료 💕";title.classList.add("shake");setTimeout(()=>title.classList.remove("shake"),400)}
function spin(){if(spinning)return;const used=loadToday();if(used){showWinner(used);showLimit();return}spinning=true;title.textContent="룰렛이 돌아가고 있어요… 🎀";wheel.classList.add("spinning");const index=Math.floor(Math.random()*prizes.length);const rounds=5+Math.floor(Math.random()*3);const sector=360/prizes.length;const target=currentRotation+rounds*360-index*sector;currentRotation=target;wheel.style.transform=`rotate(${target}deg)`;setTimeout(()=>{spinning=false;wheel.classList.remove("spinning");const s=saveToday(prizes[index],index);showWinner(s,true)},2050)}
wheel.addEventListener("click",spin);wheel.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();spin()}});title.addEventListener("click",()=>{if(todayResult)showLimit()});
const initial=loadToday();if(initial)showWinner(initial);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body>
</html>
